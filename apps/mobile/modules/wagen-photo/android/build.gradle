plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.wagenphoto'
version = '0.1.0'

android {
  namespace "expo.modules.wagenphoto"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // ML Kit Subject Segmentation (4.4) - model se isporucuje kroz Google Play
  // services (play-services-mlkit varijanta), ne bundla se u APK
  implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
  // Provjera i zahtjev za instalaciju ML modula na uredjaju
  implementation 'com.google.android.gms:play-services-base:18.5.0'
}
