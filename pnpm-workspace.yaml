packages:
  - 'apps/*'
  - 'packages/*'

# NAPOMENA: pnpm 11 NE cita ove postavke iz .npmrc - moraju biti ovdje,
# u camelCase obliku. Provjera da je postavka stvarno primljena:
#   pnpm config get node-linker   (ne smije vratiti "undefined")

# Metro (React Native bundler) lose prati simbolicke linkove, pa node_modules
# mora biti plosnat. Zadrzavamo pnpm store i workspace protokol.
nodeLinker: hoisted

# React Native ekosustav ima kronicno neuredne peer deps (SDK 57 ih ima i
# medu vlastitim paketima); strogi nacin bi blokirao instalaciju na tudim greskama.
strictPeerDependencies: false

# Postinstall skripte su blokirane po defaultu (pnpm sigurnosna mjera) i svaka
# odluka mora biti eksplicitno zapisana ovdje - ne kroz interaktivni prompt,
# da CI i svjeza klona dobiju isto ponasanje.
#
# unrs-resolver: dolazi kroz eslint-config-next -> eslint-import-resolver-typescript.
# Nativnu binarku za platformu isporucuje zasebna optional ovisnost
# (@unrs/resolver-binding-win32-x64-msvc), pa postinstall skripta nije potrebna.
allowBuilds:
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@expo/image-utils@0.11.5'
  - '@expo/require-utils@57.0.5'
  - expo-asset@57.0.14
  - expo-constants@57.0.14
